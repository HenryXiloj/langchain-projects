[project]
name = "ai-website-security-checker"
version = "0.1.0"
description = "AI-assisted website security checker using FastAPI, LangGraph, and OpenAI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.60",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "reportlab>=4.2.5",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
security-checker = "security_checker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_checker"]
